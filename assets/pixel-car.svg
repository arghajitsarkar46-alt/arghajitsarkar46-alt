<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" shape-rendering="crispEdges" role="img" aria-label="A pixel art car driving along a road" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pixel car running</title>
  <defs>
    <clipPath id="frame"><rect width="800" height="200" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Sky -->
    <rect width="800" height="200" fill="#8ed1fc"/>

    <!-- Sun (pixel plus-shape) -->
    <g fill="#ffd93b">
      <rect x="688" y="24" width="32" height="32"/>
      <rect x="680" y="32" width="48" height="16"/>
      <rect x="696" y="16" width="16" height="48"/>
    </g>

    <!-- Clouds drifting left -->
    <g fill="#ffffff">
      <g>
        <animateTransform attributeName="transform" type="translate" from="820 60" to="-100 60" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="16" width="64" height="16"/>
        <rect x="16" y="0" width="32" height="16"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" from="820 30" to="-100 30" dur="40s" begin="-18s" repeatCount="indefinite"/>
        <rect x="0" y="16" width="48" height="8"/>
        <rect x="8" y="8" width="24" height="8"/>
      </g>
    </g>

    <!-- Your text (edit me) -->
    <text x="24" y="44" font-family="monospace" font-size="22" font-weight="bold" fill="#1d3557">Hi, I'm YOUR NAME</text>
    <text x="24" y="68" font-family="monospace" font-size="14" fill="#1d3557">Coding my way down the road</text>

    <!-- Grass strip -->
    <rect y="144" width="800" height="12" fill="#5cb85c"/>
    <rect y="144" width="800" height="4" fill="#3f9b4b"/>

    <!-- Road -->
    <rect y="156" width="800" height="44" fill="#3a3f4b"/>
    <rect y="156" width="800" height="4" fill="#2b2f38"/>

    <!-- Moving center line -->
    <line x1="0" y1="182" x2="800" y2="182" stroke="#f5f5f5" stroke-width="4" stroke-dasharray="30 20">
      <animate attributeName="stroke-dashoffset" from="0" to="50" dur="0.35s" repeatCount="indefinite"/>
    </line>

    <!-- Car: drives left to right, loops forever -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="-170 108" to="840 108" dur="6s" repeatCount="indefinite"/>

      <!-- Dust puffs behind the car -->
      <rect x="-6" y="38" width="6" height="6" fill="#e9ecef">
        <animate attributeName="x" values="-6;-34" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-6" y="32" width="6" height="6" fill="#e9ecef">
        <animate attributeName="x" values="-6;-34" dur="0.5s" begin="-0.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="0.5s" begin="-0.25s" repeatCount="indefinite"/>
      </rect>

      <!-- Engine bounce -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3" calcMode="discrete" dur="0.25s" repeatCount="indefinite"/>

        <!-- Headlight beam -->
        <rect x="120" y="18" width="36" height="12" fill="#ffe066" opacity="0.28"/>

        <!-- Cabin -->
        <g fill="#e63946">
          <rect x="36" y="0" width="42" height="6"/>
          <rect x="30" y="6" width="54" height="6"/>
          <rect x="24" y="12" width="66" height="6"/>
        </g>
        <!-- Windows -->
        <g fill="#cdeeff">
          <rect x="36" y="6" width="18" height="6"/>
          <rect x="60" y="6" width="18" height="6"/>
          <rect x="30" y="12" width="24" height="6"/>
          <rect x="60" y="12" width="24" height="6"/>
        </g>

        <!-- Body -->
        <rect x="0" y="18" width="120" height="12" fill="#e63946"/>
        <rect x="0" y="18" width="120" height="6" fill="#f25c54"/>
        <rect x="54" y="18" width="6" height="12" fill="#b5101c"/>
        <rect x="0" y="30" width="120" height="6" fill="#9d0208"/>

        <!-- Lights -->
        <rect x="114" y="18" width="6" height="6" fill="#ffe066"/>
        <rect x="0" y="18" width="6" height="6" fill="#ff9f1c"/>

        <!-- Wheels -->
        <g fill="#14151a">
          <rect x="18" y="30" width="24" height="12"/>
          <rect x="24" y="42" width="12" height="6"/>
          <rect x="78" y="30" width="24" height="12"/>
          <rect x="84" y="42" width="12" height="6"/>
        </g>
        <!-- Spinning hub pixels -->
        <g fill="#c9ced6">
          <rect x="24" y="36" width="6" height="6">
            <animate attributeName="x" values="24;30" calcMode="discrete" dur="0.2s" repeatCount="indefinite"/>
          </rect>
          <rect x="84" y="36" width="6" height="6">
            <animate attributeName="x" values="84;90" calcMode="discrete" dur="0.2s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>
  </g>
</svg>
